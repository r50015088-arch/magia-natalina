<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Acompanhar pedido — Magia Natalina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#faf5f4;--surface:#fff;--fg:#2a1519;--muted:#6c5156;--line:#e9dcd8;--brand:#8b1a2b;--brand-ink:#fff;--gold-fill:#d4a23a;--ok:#1c6b4a;--warn:#8a6212;--display:'Marcellus',Georgia,serif;--body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#190b0e;--surface:#261318;--fg:#f6ebe8;--muted:#c5aaae;--line:#3d252b;--brand:#b02a40;--ok:#6fcf9f;--warn:#e3b95f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#190b0e;--surface:#261318;--fg:#f6ebe8;--muted:#c5aaae;--line:#3d252b;--brand:#b02a40;--ok:#6fcf9f;--warn:#e3b95f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:520px;margin:0 auto}
.logo{display:block;text-align:center;font-family:var(--display);font-size:1.3rem;color:var(--brand);text-decoration:none;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.6rem,6vw,2rem);line-height:1.15;margin:.8rem 0 .4rem;text-wrap:balance}
p{margin:.3rem 0;color:var(--muted)}
.spin{width:56px;height:56px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--brand);margin:0 auto;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.check{width:64px;height:64px;border-radius:50%;background:var(--ok);margin:0 auto;display:flex;align-items:center;justify-content:center}
.check svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:3}
.warnic{width:64px;height:64px;border-radius:50%;background:var(--warn);margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:800}
.box{border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-top:1.1rem;text-align:left;font-size:.95rem}
.box .r{display:flex;justify-content:space-between;gap:1rem;padding:.15rem 0}
.box .r b{font-variant-numeric:tabular-nums;text-align:right}
.btn{display:flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:.8rem 1.5rem;font-weight:700;background:var(--brand);color:var(--brand-ink);text-decoration:none;min-height:46px;width:100%;margin-top:.7rem;font-size:1rem}
.btn.wa{background:#1f7a4d;color:#fff}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--fg)}
details{margin-top:1rem;text-align:left}
summary{cursor:pointer;font-weight:700;color:var(--brand)}
textarea{width:100%;height:84px;margin-top:.6rem;font:12px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:.6rem;background:transparent;color:var(--fg);resize:none}
.qr{background:#fff;border-radius:12px;padding:10px;display:inline-block;margin-top:.6rem}.qr img{display:block;width:190px;height:190px}
small{display:block;color:var(--muted);margin-top:.8rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<a class="logo" href="./">★ Magia Natalina</a>
<section class="card" id="card" aria-live="polite"></section>
</main>
<script>
var API="https://magia-pix06a4.r50015088.workers.dev";   // mesmo servidor do Pix usado em index.html
var WHATSAPP="5513981523560";
var fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function $(s){return document.querySelector(s)}
function hx(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function wa(t){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(t)}
var id=(new URLSearchParams(location.search).get("p")||location.hash.slice(1)||"").toUpperCase();
var ped=null; try{ var s=JSON.parse(localStorage.getItem("mn-pedido")||"null"); if(s&&s.pedido===id) ped=s; }catch(e){}
var t0=Date.now(), desconhecidos=0, fim=false, timer=null;
var VALIDADE=30*60*1000;

function resumo(){
  if(!ped) return '<div class="box"><div class="r"><span>Pedido</span><b>'+hx(id)+'</b></div></div>';
  var h='<div class="box"><div class="r"><span>Pedido</span><b>'+hx(ped.pedido)+'</b></div><div class="r"><span>Total</span><b>'+fmt.format(ped.total)+'</b></div>';
  (ped.itens||[]).forEach(function(i){ h+='<div class="r"><span>'+hx(i.qty)+'x '+hx(i.nome)+'</span></div>'; });
  if(ped.prazo) h+='<div class="r"><span>'+hx(ped.prazo)+'</span></div>';
  return h+'</div>';
}
function msgWa(extra){ return "Olá! Meu pedido "+id+(ped?" ("+fmt.format(ped.total)+")":"")+" na Magia Natalina. "+extra; }

function esperando(){
  var h='<div class="spin" role="img" aria-label="Aguardando"></div><h1>Aguardando a confirmação do pagamento</h1><p>Pode deixar esta página aberta. Assim que o banco confirmar o seu Pix, avisamos aqui.</p>'+resumo();
  if(ped&&ped.code) h+='<details><summary>Ainda não paguei — ver o Pix</summary>'+(ped.qr?'<div class="qr"><img alt="QR Code Pix" src="'+hx(ped.qr)+'"></div>':'')+'<textarea id="code" readonly aria-label="Pix copia e cola">'+hx(ped.code)+'</textarea><button class="btn" id="copiar">Copiar código Pix</button></details>';
  h+='<div id="ajuda" hidden><a class="btn wa" target="_blank" rel="noopener" href="'+wa(msgWa("Já paguei o Pix e gostaria de confirmar."))+'">Já paguei e não confirmou? Avisar no WhatsApp</a></div><small id="tempo"></small>';
  $("#card").innerHTML=h;
  var c=$("#copiar"); if(c) c.onclick=function(){ var v=$("#code").value; try{ navigator.clipboard.writeText(v).then(function(){c.textContent="Código copiado!"},function(){$("#code").select()}); }catch(e){ $("#code").select(); } };
}
function pago(){
  fim=true; clearInterval(timer);
  try{ localStorage.removeItem("mn-cart"); }catch(e){}
  $("#card").innerHTML='<div class="check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><h1>Pagamento confirmado!</h1><p>Recebemos o seu Pix.'+(ped&&ped.nome?' Obrigada, '+hx(ped.nome)+'!':' Obrigada por comprar na Magia Natalina.')+'</p>'+resumo()+'<a class="btn wa" target="_blank" rel="noopener" href="'+wa(msgWa("O pagamento foi confirmado. Podem seguir com o envio?"))+'">Falar com a loja no WhatsApp</a><a class="btn ghost" href="./">Voltar à loja</a>';
}
function expirou(){
  fim=true; clearInterval(timer);
  $("#card").innerHTML='<div class="warnic">!</div><h1>Este Pix expirou</h1><p>Não identificamos o pagamento dentro do prazo. Se você já pagou, avise a gente pelo WhatsApp. Se não, é só gerar um novo Pix.</p>'+resumo()+'<a class="btn wa" target="_blank" rel="noopener" href="'+wa(msgWa("Já paguei o Pix, mas a confirmação não apareceu."))+'">Já paguei — avisar no WhatsApp</a><a class="btn ghost" href="./">Gerar novo Pix na loja</a>';
}
function tique(){
  var el=$("#tempo"), ajuda=$("#ajuda"); if(!el) return;
  var criado=ped&&ped.criado?ped.criado:t0, resta=Math.max(0,Math.round((criado+VALIDADE-Date.now())/1000));
  el.textContent= resta>0 ? "Este Pix vale por mais "+Math.floor(resta/60)+":"+String(resta%60).padStart(2,"0")+"." : "";
  if(ajuda&&(Date.now()-t0>90000||desconhecidos>=3)) ajuda.hidden=false;
}
function consulta(){
  if(fim) return;
  fetch(API+"/status?pedido="+encodeURIComponent(id),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok) return;
    if(d.status==="pago") pago();
    else if(d.status==="expirado") expirou();
    else { if(d.status==="desconhecido") desconhecidos++; if(ped&&ped.criado&&Date.now()>ped.criado+VALIDADE+60000) expirou(); }
  }).catch(function(){});
}
if(!/^MN[0-9A-Z]{6,}$/.test(id)){
  $("#card").innerHTML='<div class="warnic">?</div><h1>Pedido não encontrado</h1><p>O link parece incompleto. Volte à loja ou fale com a gente.</p><a class="btn" href="./">Voltar à loja</a><a class="btn wa" target="_blank" rel="noopener" href="'+wa("Olá! Preciso de ajuda com meu pedido.")+'">Falar no WhatsApp</a>';
} else {
  esperando(); tique(); consulta();
  timer=setInterval(function(){ consulta(); tique(); },4000);
  setInterval(function(){ if(!fim) tique(); },1000);
}
</script>
</body>
</html>
