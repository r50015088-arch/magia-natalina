<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Acompanhar pedido — Magia Natalina</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
:root{--bg:#faf5f4;--surface:#fff;--fg:#2a1519;--muted:#6c5156;--line:#e9dcd8;--brand:#8b1a2b;--brand-ink:#fff;--gold-fill:#d4a23a;--ok:#1c6b4a;--ok-bg:#e8f3ec;--warn:#8a6212;--err:#b3261e;--wa:#1f7a4d;--display:'Marcellus',Georgia,serif;--body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#190b0e;--surface:#261318;--fg:#f6ebe8;--muted:#c5aaae;--line:#3d252b;--brand:#b02a40;--ok:#6fcf9f;--ok-bg:#143325;--warn:#e3b95f;--err:#ff8a80;--wa:#2a9a62;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#190b0e;--surface:#261318;--fg:#f6ebe8;--muted:#c5aaae;--line:#3d252b;--brand:#b02a40;--ok:#6fcf9f;--ok-bg:#143325;--warn:#e3b95f;--err:#ff8a80;--wa:#2a9a62;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.6;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:540px;margin:0 auto}
.logo{display:block;text-align:center;font-family:var(--display);font-size:1.3rem;color:var(--brand);text-decoration:none;margin-bottom:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center}
h1{font-family:var(--display);font-weight:400;font-size:clamp(1.75rem,7.5vw,2.3rem);line-height:1.15;margin:.9rem 0 .5rem;text-wrap:balance}
h2{font-family:var(--body);font-size:1rem;font-weight:700;margin:0 0 .5rem}
p{margin:.35rem 0;color:var(--muted)}
.spin{width:60px;height:60px;border-radius:50%;border:5px solid var(--line);border-top-color:var(--brand);margin:0 auto;animation:g 1s linear infinite}
@keyframes g{to{transform:rotate(360deg)}}
@keyframes pop{0%{transform:scale(.5);opacity:0}70%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}.check{animation:none!important}}
.check{width:84px;height:84px;border-radius:50%;background:var(--ok);margin:0 auto;display:flex;align-items:center;justify-content:center;animation:pop .45s ease-out both;box-shadow:0 0 0 10px var(--ok-bg)}
.check svg{width:44px;height:44px;stroke:#fff;fill:none;stroke-width:3}
.warnic{width:64px;height:64px;border-radius:50%;background:var(--warn);margin:0 auto;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem;font-weight:800}
.stage{margin-top:1.2rem;font-weight:700;color:var(--brand)}
.dots::after{content:"";animation:d 1.4s steps(4) infinite}
@keyframes d{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.num{display:inline-block;margin:.4rem 0 0;padding:.5rem 1rem;border:1px dashed var(--ok);border-radius:12px;background:var(--ok-bg);color:var(--ok);font-weight:800;letter-spacing:.06em;font-size:1.05rem;word-break:break-all}
.num small{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:700;margin:0 0 .1rem}
.box{border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;margin-top:1.1rem;text-align:left;font-size:1rem}
.box .r{display:flex;justify-content:space-between;gap:1rem;padding:.25rem 0}
.box .r b{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.box .tot{border-top:1px solid var(--line);margin-top:.4rem;padding-top:.6rem;font-size:1.1rem}
.box .tot b{color:var(--ok);font-size:1.25rem}
.envio{margin-top:1.1rem;padding:.9rem 1rem;border-radius:14px;background:var(--ok-bg);color:var(--fg);text-align:left;font-size:1rem}
.envio b{color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;gap:.5rem;border:0;border-radius:14px;padding:.9rem 1.2rem;font-weight:700;background:var(--brand);color:var(--brand-ink);text-decoration:none;min-height:52px;width:100%;margin-top:.8rem;font-size:1.05rem;font-family:inherit;cursor:pointer}
.btn.wa{background:var(--wa);color:#fff;min-height:64px;font-size:1.2rem;box-shadow:0 8px 20px rgba(31,122,77,.35)}
.btn.wa[aria-disabled="true"]{background:var(--line);color:var(--muted);box-shadow:none;pointer-events:none}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn[disabled]{opacity:.6}
.fm{margin-top:1.2rem;text-align:left}
.fm label{display:block;font-weight:700;margin-bottom:.35rem}
.fm input{width:100%;font:inherit;font-size:16px;min-height:52px;padding:.7rem .9rem;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
.fm input:focus{outline:3px solid var(--gold-fill);outline-offset:1px;border-color:var(--brand)}
.fm .msg{min-height:1.4em;font-size:.95rem;margin-top:.4rem}
.fm .msg.ok{color:var(--ok);font-weight:700}.fm .msg.err{color:var(--err);font-weight:700}
.passo{display:inline-flex;align-items:center;justify-content:center;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--brand);color:#fff;font-size:.9rem;margin-right:.45rem}
.hint{font-size:.9rem;text-align:center;margin-top:.5rem}
details{margin-top:1rem;text-align:left}
summary{cursor:pointer;font-weight:700;color:var(--brand);min-height:44px;display:flex;align-items:center}
textarea{width:100%;height:96px;margin-top:.6rem;font:13px/1.4 ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:10px;padding:.6rem;background:transparent;color:var(--fg);resize:none}
.qr{background:#fff;border-radius:12px;padding:10px;display:inline-block;margin-top:.6rem}.qr img{display:block;width:190px;height:190px}
small{display:block;color:var(--muted);margin-top:.8rem}
[hidden]{display:none!important}
body.ok .logo{color:var(--ok)}
</style>
</head>
<body>
<main>
<a class="logo" href="./">★ Magia Natalina</a>
<section class="card" id="card" aria-live="polite"></section>
</main>
<script>
var API="https://magia-pix06a4.r50015088.workers.dev";   // mesmo servidor do Pix usado em index.html
var WHATSAPP="5513981523560";
var fmt=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
function $(s){return document.querySelector(s)}
function hx(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function wa(t){return "https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(t)}
var id=(new URLSearchParams(location.search).get("p")||location.hash.slice(1)||"").toUpperCase();
var ped=null; try{ var s=JSON.parse(localStorage.getItem("mn-pedido")||"null"); if(s&&s.pedido===id) ped=s; }catch(e){}
var t0=Date.now(), desconhecidos=0, fim=false, timer=null;
var CHAVE_EMAIL="mn-email-"+id;
var statusCache=null; // dados vindos do servidor (itens/total), usados se o navegador nao tiver o resumo local

function itensPedido(){ return (ped&&ped.itens&&ped.itens.length)?ped.itens:((statusCache&&statusCache.itens)||[]); }
function totalPedido(){ return ped&&typeof ped.total==="number"?ped.total:(statusCache&&statusCache.total); }
function resumo(pagoOk){
  var h='<div class="box">', tot=totalPedido();
  itensPedido().forEach(function(i){ h+='<div class="r"><span>'+hx(i.qty)+'x '+hx(i.nome)+'</span></div>'; });
  if(!itensPedido().length) h+='<div class="r"><span>Pedido</span><b>'+hx(id)+'</b></div>';
  if(typeof tot==="number") h+='<div class="r tot"><span>'+(pagoOk?'Valor pago':'Total')+'</span><b>'+fmt.format(tot)+'</b></div>';
  return h+'</div>';
}
function msgWa(extra){ return "Olá! Meu pedido #"+id+(typeof totalPedido()==="number"?" ("+fmt.format(totalPedido())+")":"")+" na Magia Natalina. "+extra; }
function msgPago(email){
  var l=["Olá! Meu pagamento foi confirmado na Magia Natalina.","Pedido: #"+id];
  if(ped&&ped.nome) l.push("Nome: "+ped.nome);
  itensPedido().forEach(function(i){ l.push("• "+i.qty+"x "+i.nome); });
  if(typeof totalPedido()==="number") l.push("Valor pago: "+fmt.format(totalPedido()));
  if(email) l.push("E-mail: "+email);
  l.push("Podem seguir com o preparo e o envio?");
  return l.join("\n");
}

/* tela 1: aguardando. O texto muda conforme o andamento. */
function esperando(){
  var h='<div class="spin" role="img" aria-label="Aguardando"></div><h1>Aguardando confirmação do pagamento</h1><p>Pode deixar esta página aberta. Assim que o banco confirmar o seu Pix, esta tela muda sozinha.</p><div class="stage dots" id="etapa">Aguardando confirmação</div>'+resumo(false);
  if(ped&&ped.code) h+='<details><summary>Ainda não paguei — ver o Pix</summary>'+(ped.qr?'<div class="qr"><img alt="QR Code Pix" src="'+hx(ped.qr)+'"></div>':'')+'<textarea id="code" readonly aria-label="Pix copia e cola">'+hx(ped.code)+'</textarea><button class="btn ghost" id="copiar">Copiar código Pix</button></details>';
  h+='<div id="ajuda" hidden><a class="btn wa" style="min-height:52px;font-size:1rem" target="_blank" rel="noopener" href="'+wa(msgWa("Já paguei o Pix e gostaria de confirmar."))+'">Já paguei e não confirmou? Avisar no WhatsApp</a></div><small id="tempo"></small>';
  $("#card").innerHTML=h;
  var c=$("#copiar"); if(c) c.onclick=function(){ var v=$("#code").value; try{ navigator.clipboard.writeText(v).then(function(){c.textContent="Código copiado!"},function(){$("#code").select()}); }catch(e){ $("#code").select(); } };
}

/* tela 2: pagamento recebido (rapida, so para dar o retorno visual) -> tela 3 */
function recebido(){
  fim=true; clearInterval(timer);
  try{ localStorage.removeItem("mn-cart"); }catch(e){}
  $("#card").innerHTML='<div class="check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div><h1>Pagamento recebido!</h1><p>Só um instante…</p>';
  setTimeout(sucesso,1300);
}

/* tela 3: painel pos-compra */
function sucesso(){
  document.body.classList.add("ok"); document.title="Pagamento confirmado — Magia Natalina";
  var emailSalvo=""; try{ emailSalvo=localStorage.getItem(CHAVE_EMAIL)||""; }catch(e){}
  var inicial=emailSalvo||(ped&&ped.email)||"";
  $("#card").innerHTML='<div class="check"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>'
   +'<h1>Pagamento confirmado!</h1>'
   +'<div class="num"><small>Número do pedido</small>#'+hx(id)+'</div>'
   +resumo(true)
   +'<div class="envio">Seu pedido será preparado e enviado de <b>Santos/SP</b>.'+(ped&&ped.prazo?'<br><span style="color:var(--muted);font-size:.95rem">'+hx(ped.prazo)+'</span>':'')+'</div>'
   +'<form class="fm" id="fe" novalidate><label for="em"><span class="passo">1</span>Seu e-mail (obrigatório)</label>'
   +'<input id="em" type="email" inputmode="email" autocomplete="email" required placeholder="seuemail@exemplo.com" value="'+hx(inicial)+'">'
   +'<div class="msg" id="emsg" role="status"></div>'
   +'<button class="btn" id="eb" type="submit">Confirmar e-mail</button><p class="hint">Enviamos a confirmação do pedido e o código de rastreio para este e-mail.</p></form>'
   +'<div style="margin-top:1.4rem;text-align:left"><h2><span class="passo">2</span>Continue o atendimento</h2></div>'
   +'<a class="btn wa" id="wa" target="_blank" rel="noopener" aria-disabled="true" href="#">Continuar no WhatsApp</a>'
   +'<p class="hint" id="wahint">Confirme seu e-mail acima para liberar o botão.</p>'
   +'<a class="btn ghost" href="./">Voltar à loja</a>';
  var liberado=false;
  function liberar(email){
    liberado=true; var a=$("#wa"); a.setAttribute("aria-disabled","false"); a.href=wa(msgPago(email));
    $("#wahint").textContent="Nossa equipe atende você pessoalmente, por aqui, para confirmar os dados e acompanhar a entrega.";
  }
  if(emailSalvo) liberar(emailSalvo);
  $("#fe").addEventListener("submit",function(ev){
    ev.preventDefault();
    var em=$("#em").value.trim().toLowerCase(), msg=$("#emsg"), btn=$("#eb");
    msg.className="msg";
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em)){ msg.className="msg err"; msg.textContent="Digite um e-mail válido para continuar."; $("#em").focus(); return; }
    btn.disabled=true; btn.textContent="Enviando…"; msg.textContent="";
    fetch(API+"/pedido/email",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pedido:id,email:em})})
     .then(function(r){return r.json()}).then(function(d){
       if(d&&d.ok){
         try{ localStorage.setItem(CHAVE_EMAIL,em); }catch(e){}
         msg.className="msg ok"; msg.textContent=d.enviado?"Pronto! Enviamos a confirmação para "+em+".":"E-mail registrado: "+em+". Em instantes você recebe a confirmação.";
         btn.textContent="E-mail confirmado"; liberar(em);
       } else if(d&&d.erro==="muitas_trocas"){ msg.className="msg err"; msg.textContent="Você já alterou o e-mail várias vezes. Continue pelo WhatsApp e corrigimos para você."; btn.disabled=false; btn.textContent="Confirmar e-mail"; liberar(em); }
       else { throw 0; }
     }).catch(function(){
       // nao trava o cliente: se o servidor nao responder, o atendimento segue pelo WhatsApp
       msg.className="msg err"; msg.textContent="Não conseguimos registrar agora, mas você pode continuar pelo WhatsApp (informe seu e-mail lá).";
       btn.disabled=false; btn.textContent="Tentar de novo"; liberar(em);
     });
  });
}
function expirou(){
  fim=true; clearInterval(timer);
  $("#card").innerHTML='<div class="warnic">!</div><h1>Este Pix expirou</h1><p>O prazo deste Pix terminou. Se você já pagou, avise a gente pelo WhatsApp. Se não, é só gerar um novo Pix.</p>'+resumo(false)+'<a class="btn wa" style="min-height:52px;font-size:1rem" target="_blank" rel="noopener" href="'+wa(msgWa("Já paguei o Pix, mas a confirmação não apareceu."))+'">Já paguei — avisar no WhatsApp</a><a class="btn ghost" href="./">Gerar novo Pix na loja</a>';
}
function tique(){
  var ajuda=$("#ajuda"); if(!ajuda) return;
  if(Date.now()-t0>90000||desconhecidos>=3) ajuda.hidden=false;
}
function consulta(){
  if(fim) return;
  fetch(API+"/status?pedido="+encodeURIComponent(id),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){
    if(!d||!d.ok) return;
    if(d.status==="pago"){ statusCache=d; recebido(); }
    else if(d.status==="expirado") expirou();
    else { if(d.status==="desconhecido") desconhecidos++; }
  }).catch(function(){});
}
if(!/^MN[0-9A-Z]{6,}$/.test(id)){
  $("#card").innerHTML='<div class="warnic">?</div><h1>Pedido não encontrado</h1><p>O link parece incompleto. Volte à loja ou fale com a gente.</p><a class="btn" href="./">Voltar à loja</a><a class="btn wa" target="_blank" rel="noopener" href="'+wa("Olá! Preciso de ajuda com meu pedido.")+'">Falar no WhatsApp</a>';
} else {
  esperando(); tique(); consulta();
  timer=setInterval(function(){ consulta(); tique(); },4000);
  setInterval(function(){ if(!fim) tique(); },1000);
}
</script>
</body>
</html>
