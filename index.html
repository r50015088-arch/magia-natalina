<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magia Natalina</title>
  <style>
    body{font-family:system-ui,sans-serif;max-width:42rem;margin:10vh auto;padding:0 1.25rem;color:#2a1519;line-height:1.55}
    a{color:#8b1a2b}
  </style>
</head>
<body>
  <p>Restaurando a loja…</p>
  <p id="status">Carregando a versão anterior estável do site.</p>
  <script>
    (async function () {
      var url = 'https://raw.githubusercontent.com/r50015088-arch/magia-natalina/906259e8e4ea4013f239d051eec37714f66a4fb3/index.html';
      try {
        var response = await fetch(url, { cache: 'no-store' });
        if (!response.ok) throw new Error('Não foi possível carregar a versão estável.');
        var html = await response.text();
        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.getElementById('status').textContent = 'A restauração automática falhou. Abra o arquivo index.html no GitHub e reverta o commit 454ee455437f1553f561419be48f6fc116a17d62 para recuperar a versão anterior.';
      }
    })();
  </script>
</body>
</html>
